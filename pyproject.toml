[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tau-tool-prediction"
version = "0.1.0"
description = "Leakage-safe next-action prediction experiments for tau-bench Retail"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.5", "transformers>=5.0"]
plots = ["matplotlib>=3.8", "numpy>=1.26"]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

